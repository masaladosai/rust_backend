[package]
name = "rust_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["http2", "macros", "ws"] }
sea-orm = { version = "1.1.16", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1.0.225", features = ["derive", "serde_derive"] }
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.18.1", features = ["v4"] }
